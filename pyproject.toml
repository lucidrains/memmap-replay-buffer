[project]
name = "memmap-replay-buffer"
version = "0.2.0"
description = "Simple Replay Buffer for RL"
authors = [
    { name = "Phil Wang", email = "lucidrains@gmail.com" }
]
readme = "README.md"
requires-python = ">= 3.10"
license = { file = "LICENSE" }
keywords = [
    'artificial intelligence',
    'deep learning',
    'replay buffer'
]

classifiers=[
    'Development Status :: 4 - Beta',
    'Intended Audience :: Developers',
    'Topic :: Scientific/Engineering :: Artificial Intelligence',
    'License :: OSI Approved :: MIT License'
]

dependencies = [
    "beartype",
    "einops>=0.8.1",
    "einx>=0.4.0",
    "numpy",
    "torch>=2.4"
]

[project.urls]
Homepage = "https://pypi.org/project/memmap-replay-buffer/"
Repository = "https://codeberg.org/lucidrains/memmap-replay-buffer"

[project.optional-dependencies]
test = [
    "pytest",
    "h5py"
]

[tool.pytest.ini_options]
pythonpath = [
    "."
]
testpaths = [
    "tests"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["memmap_replay_buffer"]

[tool.hatch.build.targets.sdist]
include = [
    "/memmap_replay_buffer",
    "/tests",
    "/pyproject.toml",
    "/LICENSE",
    "/README.md"
]
